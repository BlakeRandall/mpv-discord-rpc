name: Default Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pre-Check
        uses: pre-commit/action@v3.0.1

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Tests
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: cargo test --locked

  release:
    name: Create Release
    if: github.ref_type == 'tag'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: true

  build:
    name: Build (${{ matrix.target }})
    needs:
      - checks
      - release
    if: >-
      always() &&
      needs.checks.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: x86_64-pc-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux musl Tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Windows GNU Linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Rust Binary
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PACKAGE="mpv-discord-rpc-${REF_NAME}-${TARGET}"
          BINARY="mpv-discord-rpc"
          EXT=""
          [[ "$TARGET" == *windows* ]] && EXT=".exe"

          mkdir -p "dist/${PACKAGE}"

          cp "target/${TARGET}/release/${BINARY}${EXT}" "dist/${PACKAGE}/"

          tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"

          cd dist
          sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"

      - name: Upload CI Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.checksum }}