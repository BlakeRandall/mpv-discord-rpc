name: Default Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pre-Check
        uses: pre-commit/action@v3.0.1

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Tests
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: cargo test --locked

  release:
    name: Create Release
    if: github.ref_type == 'tag'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: true

  build:
    name: Build (${{ matrix.target }})
    needs:
      - checks
      - release
    if: >-
      always() &&
      needs.checks.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest

    env:
      BINARY: mpv-discord-rpc

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            extension: ""
            install: |
              sudo apt-get update
              sudo apt-get install -y musl-tools

          - target: x86_64-pc-windows-gnu
            extension: ".exe"
            install: |
              sudo apt-get update
              sudo apt-get install -y gcc-mingw-w64-x86-64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Platform Tools
        run: ${{ matrix.install }}

      - name: Build Rust Binary
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Binary
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PACKAGE="${BINARY}-${REF_NAME}-${TARGET}"
          ARCHIVE="${PACKAGE}.tar.gz"
          CHECKSUM="${ARCHIVE}.sha256"

          mkdir -p "dist/${PACKAGE}"
          cp "target/${TARGET}/release/${BINARY}${EXTENSION}" "dist/${PACKAGE}/"

          tar -C dist -czf "dist/${ARCHIVE}" "${PACKAGE}"

          cd dist
          sha256sum "${ARCHIVE}" > "${CHECKSUM}"

          echo "target=${BINARY}${EXTENSION}" >> "$GITHUB_OUTPUT"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

          echo "target_path=dist/${BINARY}${EXTENSION}" >> "$GITHUB_OUTPUT"
          echo "archive_path=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=dist/${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Upload CI Artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          archive: false
          name: ${{ steps.package.outputs.target }}
          path: |
            ${{ steps.package.outputs.target_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release Assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}